<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wildcard prompt viewer</title>
<style>
 :root{--bg:#f6f6f4;--fg:#1d1d1b;--pane:#fff;--line:#d5d5cf;--accent:#2b5fd9}
 @media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#e8e8e4;--pane:#1f1f1f;--line:#3a3a38;--accent:#7aa2ff}}
 *{box-sizing:border-box} html,body{height:100%;margin:0}
 body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
 header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
 button,input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--pane);color:var(--fg)}
 button.p{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
 main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
 @media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
 .box{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--pane)}
 .box h2{margin:0;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
 textarea,#out{flex:1;min-height:0;width:100%;margin:0;padding:12px;border:0;background:transparent;color:var(--fg);font:14px/1.55 ui-monospace,Consolas,monospace;overflow:auto;resize:none;white-space:pre-wrap}
 #out{outline:0} small{opacity:.7}
</style></head><body>
<header>
 <button class="p" id="load">Load wildcards folder…</button><input id="dir" type="file" webkitdirectory hidden>
 <input id="start" list="names" placeholder="start file, e.g. f_prompt_master_by_age" size="34"><datalist id="names"></datalist>
 <button id="gen">Generate sample</button><button id="useTpl">Expand the template on the left</button>
 <label>seed <input id="seed" size="6" placeholder="random"></label><small id="status">No folder loaded.</small>
</header>
<main>
 <section class="box"><h2>Prompt design (template) — scrolls</h2><textarea id="tpl" spellcheck="false">The scene: __settings10000__ A person: __f_prompt_master_by_age__</textarea></section>
 <section class="box"><h2>Sample output — scrolls, same height</h2><div id="out" tabindex="0"></div></section>
</main>
<script>
const files={};let rng=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);
$('load').onclick=()=>$('dir').click();
$('dir').onchange=async e=>{const fl=[...e.target.files].filter(f=>f.name.endsWith('.txt'));$('status').textContent='Reading '+fl.length+' files…';
 for(const f of fl){const t=await f.text();files[f.name.slice(0,-4)]=t.split(/\r?\n/)}
 $('names').innerHTML=Object.keys(files).sort().map(n=>`<option value="${n}">`).join('');$('status').textContent=fl.length+' wildcard files loaded.'};
function pick(a){return a[Math.floor(rng()*a.length)]}
function expand(t){for(let i=0;i<30;i++){const n=t.replace(/\{([^{}]*)\}/g,(_,m)=>pick(m.split('|'))).replace(/__([A-Za-z0-9_\-\/]+)__/g,(m,k)=>files[k]?pick(files[k]):m);if(n===t)break;t=n}
 return t.replace(/\s+/g,' ').replace(/\s+([.,;:])/g,'$1').replace(/([.,;:])\1+/g,'$1').trim()}
function seed(){const s=$('seed').value.trim();rng=s?mulberry([...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)):Math.random}
$('gen').onclick=()=>{seed();const n=$('start').value.trim();if(!files[n]){$('out').textContent='Type the name of a loaded file (without .txt) in the start box.';return}$('out').textContent=expand(pick(files[n]))};
$('useTpl').onclick=()=>{seed();$('out').textContent=expand($('tpl').value)};
</script></body></html>
